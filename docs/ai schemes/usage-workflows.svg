<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="2170" viewBox="0 0 1340 2170">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .title { font-size: 24px; font-weight: 700; }
      .sub { font-size: 13px; fill: #444; }
      .h { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .hs { font-size: 11px; fill: #555; text-anchor: middle; }
      .n { font-size: 12px; }
      .t { font-size: 12px; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
      .ft { font-size: 13px; font-weight: 700; }
      .fs { font-size: 12.5px; font-style: italic; font-weight: 600; fill: #555; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
      .band-label { font-size: 12px; font-weight: 700; fill: #B4501A; text-anchor: middle; }
      .life { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 5 4; }
      .m { stroke: #1a1a1a; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .r { stroke: #1a1a1a; stroke-width: 1.2; fill: none; stroke-dasharray: 6 4; marker-end: url(#o); }
      .own { fill: #FEEA9A; stroke: #FF7E2E; stroke-width: 2; }
      .ext { fill: #fff; stroke: #666; stroke-width: 1.5; stroke-dasharray: 6 3; }
      .note { fill: #E3FCFC; stroke: #23B5B5; stroke-width: 1; }
      .band { fill: #FFFBEA; stroke: #FF7E2E; stroke-width: 1.2; }
      .frame { fill: none; stroke: #9a9a9a; stroke-width: 1.2; }
      .tab { fill: #F0F0F0; stroke: #9a9a9a; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1340" height="2170" fill="#ffffff"/>

  <text x="15" y="42" class="title">Moodle Assignment Checking Helper — what the lecturer can do</text>
  <text x="15" y="66" class="sub">Everything the lecturer does with the program and what they see in return.</text>
  <line x1="15" y1="88" x2="49" y2="88" class="m"/>
  <text x="58" y="92" class="n">what the lecturer does, or what is passed on</text>
  <line x1="340" y1="88" x2="374" y2="88" class="r"/>
  <text x="383" y="92" class="n">what the lecturer sees</text>
  <rect x="560" y="79" width="34" height="18" class="own"/>
  <text x="603" y="92" class="n">part of this program</text>
  <rect x="760" y="79" width="34" height="18" class="ext"/>
  <text x="803" y="92" class="n">outside the program</text>

  <!-- Extension bands -->
  <rect x="390" y="118" width="370" height="78" rx="6" class="band"/>
  <text x="575" y="135" class="band-label">Google Chrome extension</text>
  <rect x="960" y="118" width="370" height="78" rx="6" class="band"/>
  <text x="1145" y="135" class="band-label">Visual Studio Code extension</text>

  <!-- Lifelines -->
  <line x1="100" y1="190" x2="100" y2="2150" class="life"/>
  <line x1="290" y1="190" x2="290" y2="2150" class="life"/>
  <line x1="480" y1="190" x2="480" y2="2150" class="life"/>
  <line x1="670" y1="190" x2="670" y2="2150" class="life"/>
  <line x1="860" y1="190" x2="860" y2="2150" class="life"/>
  <line x1="1050" y1="190" x2="1050" y2="2150" class="life"/>
  <line x1="1240" y1="190" x2="1240" y2="2150" class="life"/>

  <!-- Participants -->
  <rect x="15" y="144" width="170" height="46" rx="3" class="ext"/>
  <text x="100" y="163" class="h">Lecturer</text><text x="100" y="180" class="hs">grades in Moodle</text>
  <rect x="205" y="144" width="170" height="46" rx="3" class="ext"/>
  <text x="290" y="163" class="h">Moodle</text><text x="290" y="180" class="hs">pages in Chrome</text>
  <rect x="395" y="144" width="170" height="46" rx="3" class="own"/>
  <text x="480" y="163" class="h">Helper on the page</text><text x="480" y="180" class="hs">grading panel, quiz button</text>
  <rect x="585" y="144" width="170" height="46" rx="3" class="own"/>
  <text x="670" y="163" class="h">Extension popup</text><text x="670" y="180" class="hs">toolbar icon</text>
  <rect x="775" y="144" width="170" height="46" rx="3" class="ext"/>
  <text x="860" y="163" class="h">Definitions folder</text><text x="860" y="180" class="hs">JSON files on disk</text>
  <rect x="965" y="144" width="170" height="46" rx="3" class="own"/>
  <text x="1050" y="163" class="h">VS Code editors</text><text x="1050" y="180" class="hs">submission files, terminal</text>
  <rect x="1155" y="144" width="170" height="46" rx="3" class="own"/>
  <text x="1240" y="163" class="h">VS Code sidebar</text><text x="1240" y="180" class="hs">and status bar</text>

  <!-- Frames -->
  <rect x="10" y="210" width="1320" height="350" class="frame"/>
  <path d="M10 210 H300 V224 L292 232 H10 Z" class="tab"/>
  <text x="20" y="226" class="ft">1 · Preparing the grading matrices</text>

  <rect x="10" y="576" width="1320" height="522" class="frame"/>
  <path d="M10 576 H220 V590 L212 598 H10 Z" class="tab"/>
  <text x="20" y="592" class="ft">2 · Grading a submission</text>

  <rect x="10" y="1114" width="1320" height="236" class="frame"/>
  <path d="M10 1114 H330 V1128 L322 1136 H10 Z" class="tab"/>
  <text x="20" y="1130" class="ft">3 · Quiz: full points without a comment</text>

  <rect x="10" y="1366" width="1320" height="422" class="frame"/>
  <path d="M10 1366 H270 V1380 L262 1388 H10 Z" class="tab"/>
  <text x="20" y="1382" class="ft">4 · Taking over and recovering</text>

  <rect x="10" y="1804" width="1320" height="226" class="frame"/>
  <path d="M10 1804 H180 V1818 L172 1826 H10 Z" class="tab"/>
  <text x="20" y="1820" class="ft">5 · VS Code extras</text>

  <rect x="10" y="2046" width="1320" height="101" class="frame"/>
  <path d="M10 2046 H240 V2060 L232 2068 H10 Z" class="tab"/>
  <text x="20" y="2062" class="ft">6 · Following what happens</text>

  <!-- 1 · Preparing the grading matrices -->
  <line x1="100" y1="260" x2="860" y2="260" class="m"/>
  <text x="480" y="254" class="t">writes one definition file per assignment, in any text editor (see the grading matrix diagram)</text>

  <line x1="100" y1="292" x2="670" y2="292" class="m"/>
  <text x="385" y="286" class="t">opens the popup and presses "Choose the definitions folder"</text>

  <line x1="670" y1="324" x2="100" y2="324" class="r"/>
  <text x="385" y="318" class="t">Chrome asks for permission to read the folder</text>

  <line x1="100" y1="356" x2="670" y2="356" class="m"/>
  <text x="385" y="350" class="t">allows it</text>

  <line x1="670" y1="388" x2="860" y2="388" class="m"/>
  <text x="765" y="382" class="t">reads all files</text>

  <line x1="670" y1="434" x2="100" y2="434" class="r"/>
  <text x="385" y="414" class="t">the definitions grouped by course, when they were loaded,</text>
  <text x="385" y="428" class="t">and the broken files with their first problem (status line)</text>

  <line x1="100" y1="466" x2="860" y2="466" class="m"/>
  <text x="480" y="460" class="t">later: changes a definition</text>

  <line x1="100" y1="498" x2="670" y2="498" class="m"/>
  <text x="385" y="492" class="t">presses "Reload from files"</text>

  <line x1="480" y1="544" x2="100" y2="544" class="r"/>
  <text x="290" y="524" class="t">an open panel shows the changed matrix,</text>
  <text x="290" y="538" class="t">unchanged parts keep their selection</text>

  <!-- 2 · Grading a submission -->
  <line x1="100" y1="640" x2="290" y2="640" class="m"/>
  <text x="195" y="620" class="t">opens the assignment's</text>
  <text x="195" y="634" class="t">grading page</text>

  <line x1="480" y1="686" x2="100" y2="686" class="r"/>
  <text x="290" y="666" class="t">the panel next to Moodle's grade panel: grading</text>
  <text x="290" y="680" class="t">matrix, comment start, preview, status line</text>

  <line x1="480" y1="718" x2="1050" y2="718" class="m"/>
  <text x="765" y="712" class="t">the student being graded (automatically)</text>

  <line x1="1050" y1="764" x2="100" y2="764" class="r"/>
  <text x="575" y="744" class="t">the student's files open (up to 20, in 2 columns); the previous student's editors and terminals close;</text>
  <text x="575" y="758" class="t">a warning if no folder is open in VS Code or the student's folder isn't there</text>

  <line x1="100" y1="796" x2="1050" y2="796" class="m"/>
  <text x="575" y="790" class="t">checks the submission: reads it, runs it</text>

  <line x1="100" y1="842" x2="480" y2="842" class="m"/>
  <text x="290" y="822" class="t">ticks / unticks parts (thumbs-up),</text>
  <text x="290" y="836" class="t">writes the comment start</text>

  <line x1="480" y1="874" x2="100" y2="874" class="r"/>
  <text x="290" y="868" class="t">live preview of the grade and the comment</text>

  <line x1="100" y1="906" x2="480" y2="906" class="m"/>
  <text x="290" y="900" class="t">drags the panel's left edge to resize it</text>

  <line x1="100" y1="938" x2="480" y2="938" class="m"/>
  <text x="290" y="932" class="t">presses "Fill the fields in Moodle"</text>

  <line x1="480" y1="984" x2="290" y2="984" class="m"/>
  <text x="385" y="964" class="t">writes the grade and</text>
  <text x="385" y="978" class="t">comment into Moodle</text>

  <line x1="100" y1="1030" x2="290" y2="1030" class="m"/>
  <text x="195" y="1010" class="t">may still edit them, then</text>
  <text x="195" y="1024" class="t">"Save and show next"</text>

  <rect x="235" y="1046" width="300" height="40" class="note"/>
  <text x="245" y="1063" class="n">the next student opens: the panel and VS Code</text>
  <text x="245" y="1078" class="n">start again from the top of 2</text>

  <!-- 3 · Quiz: full points without a comment -->
  <line x1="100" y1="1178" x2="290" y2="1178" class="m"/>
  <text x="195" y="1158" class="t">opens a quiz attempt's</text>
  <text x="195" y="1172" class="t">review page</text>

  <line x1="480" y1="1224" x2="100" y2="1224" class="r"/>
  <text x="290" y="1204" class="t">a "Give max points without a comment" button</text>
  <text x="290" y="1218" class="t">under every manually graded question</text>

  <line x1="100" y1="1256" x2="480" y2="1256" class="m"/>
  <text x="290" y="1250" class="t">presses a question's button</text>

  <line x1="480" y1="1302" x2="290" y2="1302" class="m"/>
  <text x="385" y="1282" class="t">opens the comment page,</text>
  <text x="385" y="1296" class="t">enters the max mark, saves</text>

  <line x1="290" y1="1334" x2="100" y2="1334" class="r"/>
  <text x="195" y="1328" class="t">the mark is saved</text>

  <!-- 4 · Taking over and recovering -->
  <text x="25" y="1408" class="fs">a) Grading in another Moodle tab</text>

  <line x1="480" y1="1442" x2="100" y2="1442" class="r"/>
  <text x="290" y="1436" class="t">in a second tab: "another window is grading"</text>

  <line x1="100" y1="1474" x2="480" y2="1474" class="m"/>
  <text x="290" y="1468" class="t">presses "Take over grading"</text>

  <line x1="480" y1="1520" x2="100" y2="1520" class="r"/>
  <text x="290" y="1500" class="t">this tab grades now; the first tab's panel</text>
  <text x="290" y="1514" class="t">says that grading happens elsewhere</text>

  <text x="25" y="1548" class="fs">b) The panel didn't load</text>

  <line x1="100" y1="1582" x2="670" y2="1582" class="m"/>
  <text x="385" y="1576" class="t">presses "Reload the panel"</text>

  <line x1="670" y1="1614" x2="480" y2="1614" class="m"/>
  <text x="575" y="1608" class="t">panel loads again</text>

  <line x1="670" y1="1646" x2="100" y2="1646" class="r"/>
  <text x="385" y="1640" class="t">if the extension isn't active in that tab yet: "refresh the Moodle page"</text>

  <text x="25" y="1674" class="fs">c) Another VS Code window should open the files</text>

  <line x1="1240" y1="1708" x2="100" y2="1708" class="r"/>
  <text x="670" y="1702" class="t">in a window that doesn't receive the students: a "Take over receiving" button (sidebar and status bar)</text>

  <line x1="100" y1="1740" x2="1240" y2="1740" class="m"/>
  <text x="670" y="1734" class="t">presses it</text>

  <line x1="1240" y1="1772" x2="100" y2="1772" class="r"/>
  <text x="670" y="1766" class="t">this window receives the students now; the other window shows the button</text>

  <!-- 5 · VS Code extras -->
  <line x1="100" y1="1854" x2="1240" y2="1854" class="m"/>
  <text x="670" y="1848" class="t">ticks "Open files from subfolders too" (also in VS Code's Settings editor)</text>

  <line x1="1240" y1="1886" x2="100" y2="1886" class="r"/>
  <text x="670" y="1880" class="t">used from the next student on</text>

  <line x1="100" y1="1918" x2="1050" y2="1918" class="m"/>
  <text x="575" y="1912" class="t">right-clicks a .py file → "Run the Python script in a new terminal"</text>

  <line x1="1050" y1="1950" x2="100" y2="1950" class="r"/>
  <text x="575" y="1944" class="t">the script runs in a new terminal, in the file's folder</text>

  <line x1="100" y1="1982" x2="1240" y2="1982" class="m"/>
  <text x="670" y="1976" class="t">clicks the "Moodle Helper" status bar item</text>

  <line x1="1050" y1="2014" x2="100" y2="2014" class="r"/>
  <text x="575" y="2008" class="t">the extension's log opens in the Output panel</text>

  <!-- 6 · Following what happens -->
  <rect x="30" y="2080" width="1280" height="55" class="note"/>
  <text x="45" y="2097" class="n"><tspan font-weight="700">Panel's status line:</tspan> connection to VS Code · the student's files · this assignment's definition · broken definition files · Moodle page elements not found · fields filled.</text>
  <text x="45" y="2112" class="n"><tspan font-weight="700">Popup's status line:</tspan> connection to VS Code · the definitions folder · broken definition files · the panel couldn't be reloaded.</text>
  <text x="45" y="2127" class="n"><tspan font-weight="700">VS Code's sidebar and status bar:</tspan> connection to Chrome, or that another window has the port · the student's files.</text>
</svg>

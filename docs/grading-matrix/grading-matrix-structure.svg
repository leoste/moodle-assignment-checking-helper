<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .title { font-size: 24px; font-weight: 700; }
      .sub { font-size: 13px; fill: #444; }
      .bt { font-size: 16px; font-weight: 700; }
      .bt2 { font-size: 15px; font-weight: 700; }
      .badge { font-size: 12px; font-style: italic; fill: #444; text-anchor: end; }
      .f { font-family: Consolas, 'Courier New', monospace; font-size: 13px; font-weight: 700; }
      .d { font-size: 12.5px; }
      .ct { font-size: 11.5px; text-anchor: middle; }
      .ctr { font-size: 11.5px; text-anchor: middle; fill: #fff; font-weight: 700; }
      .pn { font-size: 12.5px; font-weight: 700; }
      .folder { fill: #fff; stroke: #666; stroke-width: 1.5; stroke-dasharray: 7 4; }
      .file { fill: #FFF8DC; stroke: #FF7E2E; stroke-width: 2; }
      .group { fill: #FEEA9A; stroke: #FF7E2E; stroke-width: 2; }
      .part { fill: #E3FCFC; stroke: #23B5B5; stroke-width: 2; }
      .side { fill: #FAFAFA; stroke: #c8c8c8; stroke-width: 1; }
      .hl { stroke: #000; stroke-opacity: 0.18; stroke-width: 1; }
      .sep { stroke: #000; stroke-opacity: 0.08; stroke-width: 1; }
      .req { fill: #FF7E2E; stroke: #E06A1E; stroke-width: 1; }
      .opt { fill: #fff; stroke: #999; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1400" height="850" fill="#ffffff"/>

  <text x="20" y="42" class="title">Grading matrix — what a definition file is built of</text>
  <text x="20" y="66" class="sub">One JSON file per assignment. Every box is a building block of the box around it; the italic note says how many there can be. Orange tags are required fields, white ones optional.</text>

  <!-- Definitions folder -->
  <rect x="15" y="90" width="855" height="704" rx="6" class="folder"/>
  <text x="32" y="112" class="bt">Definitions folder</text>
  <text x="855" y="111" class="badge">chosen in the popup · any number of .json files, subfolders too</text>

  <!-- Definition file -->
  <rect x="30" y="134" width="825" height="646" rx="6" class="file"/>
  <text x="47" y="156" class="bt">Definition file</text>
  <text x="840" y="155" class="badge">one per assignment</text>
  <line x1="30" y1="166" x2="855" y2="166" class="hl"/>

  <text x="47" y="192" class="f">name</text>
  <rect x="205" y="179" width="150" height="18" rx="9" class="req"/><text x="280" y="192" class="ctr">text · required</text>
  <text x="370" y="192" class="d">Name of the assignment. Shown in the popup's list of definitions</text>
  <text x="370" y="208" class="d">and in the panel's status line ("Definition: …").</text>

  <line x1="40" y1="218" x2="845" y2="218" class="sep"/>
  <text x="47" y="238" class="f">moodleIds</text>
  <rect x="205" y="225" width="150" height="18" rx="9" class="req"/><text x="280" y="238" class="ctr">number list · required</text>
  <text x="370" y="238" class="d">Moodle IDs of the assignments this definition is for. One definition</text>
  <text x="370" y="254" class="d">can serve several, e.g. the same task in another course. When none</text>
  <text x="370" y="270" class="d">matches, the panel's status line shows the assignment's ID. If two</text>
  <text x="370" y="286" class="d">definitions list the same ID, the first one read is used.</text>

  <line x1="40" y1="296" x2="845" y2="296" class="sep"/>
  <text x="47" y="316" class="f">course_code</text>
  <rect x="205" y="303" width="150" height="18" rx="9" class="opt"/><text x="280" y="316" class="ct">text · optional</text>
  <text x="370" y="316" class="d">Groups the popup's list of definitions by course; "?" when missing.</text>

  <line x1="40" y1="326" x2="845" y2="326" class="sep"/>
  <text x="47" y="346" class="f">feedback</text>
  <rect x="205" y="333" width="150" height="18" rx="9" class="req"/><text x="280" y="346" class="ctr">list · required</text>
  <text x="370" y="346" class="d">The grading matrix: its groups, top to bottom in the panel.</text>

  <!-- Feedback group -->
  <rect x="47" y="368" width="793" height="398" rx="6" class="group"/>
  <text x="64" y="389" class="bt2">Feedback group</text>
  <text x="825" y="388" class="badge">1 or more · shown in file order</text>
  <line x1="47" y1="398" x2="840" y2="398" class="hl"/>

  <text x="64" y="424" class="f">title</text>
  <rect x="222" y="411" width="150" height="18" rx="9" class="req"/><text x="297" y="424" class="ctr">text · required</text>
  <text x="387" y="424" class="d">Heading of the group in the panel.</text>

  <line x1="57" y1="434" x2="830" y2="434" class="sep"/>
  <text x="64" y="454" class="f" style="font-size:12.5px">intended_max_points</text>
  <rect x="222" y="441" width="150" height="18" rx="9" class="req"/><text x="297" y="454" class="ctr">number · required</text>
  <text x="387" y="454" class="d">Shown next to the heading, e.g. "Struktuur (15p)". For information</text>
  <text x="387" y="470" class="d">only: the grade isn't capped by it. 0 or negative in remark and</text>
  <text x="387" y="486" class="d">deduction groups.</text>

  <line x1="57" y1="496" x2="830" y2="496" class="sep"/>
  <text x="64" y="516" class="f">parts</text>
  <rect x="222" y="503" width="150" height="18" rx="9" class="req"/><text x="297" y="516" class="ctr">list · required</text>
  <text x="387" y="516" class="d">The clickable rows of the group.</text>

  <!-- Part -->
  <rect x="64" y="538" width="761" height="214" rx="6" class="part"/>
  <text x="81" y="559" class="bt2">Part</text>
  <text x="810" y="558" class="badge">1 or more · shown in file order · one clickable row in the panel</text>
  <line x1="64" y1="568" x2="825" y2="568" class="hl"/>

  <text x="81" y="594" class="f">enabled</text>
  <rect x="239" y="581" width="150" height="18" rx="9" class="req"/><text x="314" y="594" class="ctr">true/false · required</text>
  <text x="404" y="594" class="d">Selected when the page opens (thumbs-up lit).</text>

  <line x1="74" y1="604" x2="815" y2="604" class="sep"/>
  <text x="81" y="624" class="f">labelText</text>
  <rect x="239" y="611" width="150" height="18" rx="9" class="opt"/><text x="314" y="624" class="ct">text · optional</text>
  <text x="404" y="624" class="d">Caption of the row in the panel. Not put into the comment.</text>

  <line x1="74" y1="634" x2="815" y2="634" class="sep"/>
  <text x="81" y="654" class="f">enabledText</text>
  <rect x="239" y="641" width="150" height="18" rx="9" class="opt"/><text x="314" y="654" class="ct">text · optional</text>
  <text x="404" y="654" class="d">Line added to the comment while the part is selected.</text>

  <line x1="74" y1="664" x2="815" y2="664" class="sep"/>
  <text x="81" y="684" class="f">disabledText</text>
  <rect x="239" y="671" width="150" height="18" rx="9" class="opt"/><text x="314" y="684" class="ct">text · optional</text>
  <text x="404" y="684" class="d">Line added to the comment while the part is not selected.</text>

  <line x1="74" y1="694" x2="815" y2="694" class="sep"/>
  <text x="81" y="714" class="f">points</text>
  <rect x="239" y="701" width="150" height="18" rx="9" class="opt"/><text x="314" y="714" class="ct">number · optional</text>
  <text x="404" y="714" class="d">Added to the grade while selected; negative means a deduction.</text>
  <text x="404" y="730" class="d">Left out means 0 points.</text>

  <!-- From the matrix to Moodle -->
  <rect x="890" y="90" width="495" height="168" rx="6" class="side"/>
  <text x="906" y="112" class="bt">From the matrix to Moodle</text>
  <line x1="890" y1="122" x2="1385" y2="122" class="hl"/>
  <text x="906" y="146" class="d"><tspan font-weight="700">Grade</tspan> = the points of all selected parts added up, never below 0.</text>
  <text x="906" y="170" class="d"><tspan font-weight="700">Comment</tspan> = the comment start typed in the panel, then every part in</text>
  <text x="906" y="186" class="d">file order: its enabledText if selected, its disabledText if not,</text>
  <text x="906" y="202" class="d">one per line. A part without the needed text adds nothing.</text>
  <text x="906" y="226" class="d">Both are a preview until "Fill the fields in Moodle" is pressed;</text>
  <text x="906" y="242" class="d">Moodle's own save button saves them.</text>

  <!-- Rules for a file -->
  <rect x="890" y="274" width="495" height="216" rx="6" class="side"/>
  <text x="906" y="296" class="bt">Rules for a file</text>
  <line x1="890" y1="306" x2="1385" y2="306" class="hl"/>
  <text x="906" y="330" class="d">Every file is checked against src/definitions/sample-definition.json:</text>
  <text x="906" y="350" class="d">•  valid JSON, only the fields shown here, the required ones present;</text>
  <text x="906" y="368" class="d">•  every value of the type shown; null isn't allowed, so an optional</text>
  <text x="906" y="384" class="d">    field is left out instead;</text>
  <text x="906" y="402" class="d">•  lists can have any number of entries, each built like its box.</text>
  <text x="906" y="426" class="d">A file that breaks a rule is skipped, and the status line names it</text>
  <text x="906" y="442" class="d">with its first problem. After changing files, press "Reload from</text>
  <text x="906" y="458" class="d">files" in the popup: an open panel keeps the selections of the parts</text>
  <text x="906" y="474" class="d">that didn't change.</text>

  <!-- Patterns -->
  <rect x="890" y="506" width="495" height="318" rx="6" class="side"/>
  <text x="906" y="528" class="bt">Patterns in the existing definitions</text>
  <line x1="890" y1="538" x2="1385" y2="538" class="hl"/>

  <text x="906" y="560" class="pn">Scored criterion</text>
  <text x="906" y="576" class="d">labelText + points, enabled: true. The points count unless the</text>
  <text x="906" y="592" class="d">lecturer unticks the part. (Python cafes: "Struktuur")</text>

  <text x="906" y="618" class="pn">Deduction</text>
  <text x="906" y="634" class="d">Negative points, enabled: false. Ticking subtracts, e.g. late days</text>
  <text x="906" y="650" class="d">in a "Hilinemine" group with intended_max_points −6.</text>

  <text x="906" y="676" class="pn">Remark</text>
  <text x="906" y="692" class="d">enabledText only, enabled: false. A ready sentence to add when it</text>
  <text x="906" y="708" class="d">applies. (Python scraper: "Tähelepanekud")</text>

  <text x="906" y="734" class="pn">Opening and closing words</text>
  <text x="906" y="750" class="d">enabledText, enabled: true. The comment follows the file order, so</text>
  <text x="906" y="766" class="d">a sign-off goes into the last part of the last group. (SQL queries)</text>

  <text x="906" y="792" class="pn">All or nothing</text>
  <text x="906" y="808" class="d">A single part that holds all the points. (ER model: 100 points)</text>
</svg>

<!DOCTYPE html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
      }
      body {
        font-family: sans-serif;
        font-size: 14px;
        color: #000;
        padding: 12px;
        width: 800px;
        height: 600px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 4px;
      }
      .text {
        word-break: break-all;
      }
      button {
        width: 240px;
        flex-shrink: 0;
        padding: 8px;
        cursor: pointer;
        box-sizing: border-box;
      }
      hr {
        margin: 12px 0;
      }
      .definition-list {
        margin: 0;
        padding-left: 20px;
      }
      .definition-list li {
        margin-bottom: 4px;
      }
      #status-container {
        position: sticky;
        bottom: -12px;
        margin: 12px -12px -12px;
        padding: 8px 12px;
        border-top: 1px solid #000;
        background-color: #fff;
      }
      .status + .status::before {
        content: ' · ';
        font-weight: normal;
        font-style: normal;
      }
      .status-progress {
        font-style: italic;
      }
      .status-problem {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="sources-container"></div>
    <hr />
    <div class="row">
      <button id="refresh-btn"></button>
      <div id="refresh-time" class="text"></div>
    </div>
    <hr />
    <div id="definitions-container"></div>
    <div id="status-container"></div>
    <script type="module" src="popup.ts"></script>
  </body>
</html>
